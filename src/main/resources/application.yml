server:
  port: 8080

spring:
  application:
    name: pathforge-backend

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:pathforge}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-in-production}
    expiration-ms: 86400000   # 24 hours

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.pathforge: DEBUG
    org.springframework.security: INFO